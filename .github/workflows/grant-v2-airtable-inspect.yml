name: Grant v2 Airtable authenticated inspection

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v2-cross-platform-storage
    paths:
      - .github/workflows/grant-v2-airtable-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing test base using authenticated repository runtime
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          test -n "$AIRTABLE_TOKEN" || { echo "AIRTABLE_TOKEN secret unavailable"; exit 1; }
          node --input-type=module <<'NODE'
          import {buildAirtableProvisioningPlan,inspectProvisionedSchema} from './src/v2/airtable-provisioning.mjs';
          import {createAirtableMetadataTransport} from './src/v2/airtable-metadata-transport.mjs';
          const expectedBaseId='appC8hCEmhYdFxumE';
          const expectedBaseName='Grant Assistant v2 — Test';
          const transport=createAirtableMetadataTransport({token:process.env.AIRTABLE_TOKEN});
          const bases=await transport.listBases();
          const matching=bases.filter(b=>b.id===expectedBaseId);
          if(matching.length!==1||matching[0].name!==expectedBaseName)throw Error('Expected test base not accessible with exact name');
          // Workspace membership is not exposed by Airtable's base-list endpoint.
          // This is a read-only, explicitly selected base check; workspace ID is unused.
          const plan=buildAirtableProvisioningPlan({workspaceId:'read-only-inspection',baseName:expectedBaseName});
          const schema=await transport.getBaseSchema({baseId:expectedBaseId});
          const verdict=inspectProvisionedSchema(plan,{...schema,baseId:expectedBaseId});
          if(!verdict.ok){
            console.error(JSON.stringify({status:'SCHEMA_MISMATCH',baseId:expectedBaseId,errors:verdict.errors}));
            throw Error('Existing test base did not pass exact v2 schema inspection');
          }
          const counts=Object.values(verdict.config.collections).map(c=>Object.keys(c.fields).length);
          if(counts.length!==4||counts.reduce((a,b)=>a+b,0)!==84)throw Error('Unexpected field count');
          console.log(JSON.stringify({status:'PASS',baseId:expectedBaseId,collections:4,fields:84,mode:'read_only_authenticated_metadata_inspection'}));
          NODE
